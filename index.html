<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpDraftGaming | Next-Gen Web Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-darker: #090d16;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: var(--bg-darker);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }
        header {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo span {
            color: var(--accent);
        }
        .search-container {
            position: relative;
        }
        .search-bar {
            padding: 0.75rem 1.2rem;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            width: 280px;
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            transition: var(--transition);
        }
        .search-bar:focus {
            border-color: var(--accent);
            background-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        main {
            padding: 3rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .hero-section {
            text-align: center;
            margin-bottom: 4rem;
        }
        .hero-section h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-section p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
        }
        .grid-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }
        .grid-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        .game-card {
            background-color: var(--bg-dark);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            padding: 1px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
        }
        .game-thumbnail {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-darker) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            transition: var(--transition);
            position: relative;
        }
        .game-card:hover .game-thumbnail {
            transform: scale(1.02);
        }
        .game-info {
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }
        .game-name {
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 0.25rem;
            letter-spacing: -0.3px;
        }
        .game-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-darker);
            z-index: 1000;
            flex-direction: column;
        }
        .player-header {
            background-color: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(8px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .player-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }
        .close-btn:hover {
            background-color: #ef4444;
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }
        .iframe-wrapper {
            flex-grow: 1;
            width: 100%;
            height: calc(100% - 70px);
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media (max-width: 640px) {
            .hero-section h1 { font-size: 2.2rem; }
            header { padding: 1rem; }
            .search-bar { width: 160px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="closeGame()">UpDraft<span>Gaming</span></div>
        <div class="search-container">
            <input type="text" class="search-bar" id="search" placeholder="Search games..." oninput="filterGames()">
        </div>
    </header>
    <main>
        <section class="hero-section">
            <h1>UpDraftGaming</h1>
            <p>A premium, distraction-free web gaming experience.</p>
        </section>
        <div class="grid-header">
            <h2 class="grid-title">Featured Titles</h2>
        </div>
        <div class="game-grid" id="gameGrid"></div>
    </main>
    <div class="player-container" id="playerContainer">
        <div class="player-header">
            <h2 id="activeGameTitle">Loading Universe...</h2>
            <button class="close-btn" onclick="closeGame()">Leave Game</button>
        </div>
        <div class="iframe-wrapper">
            <iframe id="gameFrame" src="" allowfullscreen></iframe>
        </div>
    </div>
    <script>
        const games = [
            {
                id: "bloxd",
                name: "Bloxd.io",
                desc: "Voxel-based multiplayer parkour, sandbox, and combat.",
                url: "https://bloxd.io/",
                emoji: "🧱"
            },
            {
                id: "voxiom",
                name: "Voxiom.io",
                desc: "Real-time 3D voxel first-person shooter with crafting.",
                url: "https://historynotes.club/",
                emoji: "⚔️"
            },
            {
                id: "kirka",
                name: "Kirka.io",
                desc: "Online voxel-styled competitive first-person shooter.",
                url: "https://kirka.io/",
                emoji: "🎯"
            },
        {
                id: "Shell Shockers",
                name: "Shell Shockers",
                desc: "Real-time 3D egg shooting game",
                url: "https://shellshock.io/",
                emoji: "🥚"
            }
        ];
        const gameGrid = document.getElementById('gameGrid');
        const playerContainer = document.getElementById('playerContainer');
        const gameFrame = document.getElementById('gameFrame');
        const activeGameTitle = document.getElementById('activeGameTitle');
        function renderGames(gameList) {
            gameGrid.innerHTML = '';
            gameList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => loadGame(game.id);
                card.innerHTML = `
                    <div class="game-thumbnail">${game.emoji}</div>
                    <div class="game-info">
                        <div class="game-name">${game.name}</div>
                        <div class="game-desc">${game.desc}</div>
                    </div>
                `;
                gameGrid.appendChild(card);
            });
        }
        function loadGame(gameId) {
            const game = games.find(g => g.id === gameId);
            if (game) {
                activeGameTitle.textContent = game.name;
                gameFrame.src = game.url;
                playerContainer.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }
        function closeGame() {
            playerContainer.style.display = 'none';
            gameFrame.src = '';
            document.body.style.overflow = 'auto';
        }
        function filterGames() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = games.filter(game => game.name.toLowerCase().includes(query));
            renderGames(filtered);
        }
        renderGames(games);
    </script>
</body>
</html>
