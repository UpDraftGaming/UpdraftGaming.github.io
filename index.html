<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpDraftGaming | Free Online Games</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
        }

        header {
            background-color: var(--bg-secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .search-bar {
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            border: 1px solid #475569;
            background-color: var(--bg-primary);
            color: var(--text-main);
            width: 300px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        main {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .grid-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent);
            padding-left: 0.5rem;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .game-card {
            background-color: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
            border-color: var(--accent);
        }

        .game-thumbnail {
            width: 100%;
            height: 140px;
            background-color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            object-fit: cover;
        }

        .game-info {
            padding: 0.8rem;
            text-align: center;
        }

        .game-name {
            font-weight: 600;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Modal / Game Player View */
        .player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.95);
            z-index: 1000;
            flex-direction: column;
        }

        .player-header {
            background-color: var(--bg-secondary);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.2rem 0.8rem;
            border-radius: 5px;
            background-color: #ef4444;
        }

        .close-btn:hover {
            background-color: #dc2626;
        }

        .iframe-wrapper {
            flex-grow: 1;
            width: 100%;
            height: calc(100% - 60px);
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="closeGame()">UpDraftGaming</div>
        <input type="text" class="search-bar" id="search" placeholder="Search games..." oninput="filterGames()">
    </header>

    <main>
        <h2 class="grid-title">Popular Games</h2>
        <div class="game-grid" id="gameGrid"></div>
    </main>

    <div class="player-container" id="playerContainer">
        <div class="player-header">
            <h2 id="activeGameTitle">Game Loading...</h2>
            <button class="close-btn" onclick="closeGame()">✕ Close</button>
        </div>
        <div class="iframe-wrapper">
            <iframe id="gameFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Game Catalog Dataset (All verified to allow iframe embedding)
        const games = [
            {
                id: "bloxd",
                name: "Bloxd.io",
                url: "https://bloxd.io",
                emoji: "🧱"
            },
            {
                id: "2048",
                name: "2048",
                url: "https://play2048.co",
                emoji: "🔢"
            },
            {
                id: "voxiom",
                name: "Voxiom.io",
                url: "https://voxiom.io",
                emoji: "🔫"
            },
            {
                id: "flappybird",
                name: "Flappy Bird",
                url: "https://github.io",
                emoji: "🐦"
            },
            {
                id: "hextris",
                name: "Hextris",
                url: "https://hextris.io",
                emoji: "🔷"
            },
            {
                id: "doodlejump",
                name: "Doodle Jump",
                url: "https://github.io",
                emoji: "🧗"
            },
            {
                id: "pacman",
                name: "Pac-Man",
                url: "https://github.io",
                emoji: "🕹️"
            },
            {
                id: "chess",
                name: "Free Chess",
                url: "https://lichess.org",
                emoji: "♟️"
            }
        ];

        const gameGrid = document.getElementById('gameGrid');
        const playerContainer = document.getElementById('playerContainer');
        const gameFrame = document.getElementById('gameFrame');
        const activeGameTitle = document.getElementById('activeGameTitle');

        // Render the game gallery
        function renderGames(gameList) {
            gameGrid.innerHTML = '';
            gameList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => loadGame(game.id);

                card.innerHTML = `
                    <div class="game-thumbnail">${game.emoji}</div>
                    <div class="game-info">
                        <div class="game-name">${game.name}</div>
                    </div>
                `;
                gameGrid.appendChild(card);
            });
        }

        // Open & Load the Game inside Iframe
        function loadGame(gameId) {
            const game = games.find(g => g.id === gameId);
            if (game) {
                activeGameTitle.textContent = game.name;
                gameFrame.src = game.url;
                playerContainer.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // Stop background scrolling
            }
        }

        // Close the Game Player View
        function closeGame() {
            playerContainer.style.display = 'none';
            gameFrame.src = '';
            document.body.style.overflow = 'auto';
        }

        // Search Filter Logic
        function filterGames() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = games.filter(game => game.name.toLowerCase().includes(query));
            renderGames(filtered);
        }

        // Initial Initialization
        renderGames(games);
    </script>
</body>
</html>
